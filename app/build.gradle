plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    compileSdk 35

    defaultConfig {
        applicationId "com.kancrutt.gigginggear"
        minSdk 24
        targetSdk 35
        versionCode 123
        versionName '1.1'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                cppFlags '-g -Wl -fast'
                arguments "-DANDROID_STL=c++_shared "

            }
        }
        vectorDrawables {
            useSupportLibrary true
        }
        // TONE3000 publishable client_id (safe for client). Set via -PTONE3000_CLIENT_ID=xxx or env TONE3000_CLIENT_ID.
        // Secret key (t3k_cs_...) MUST NOT be set here — server-only.
        buildConfigField "String", "TONE3000_CLIENT_ID", "\"" + (project.findProperty("TONE3000_CLIENT_ID") ?: System.getenv("TONE3000_CLIENT_ID") ?: "") + "\""
    }

    flavorDimensions "mode"
    productFlavors {
        preview {
            dimension "mode"
            ndk {
                abiFilters "x86_64"
            }
        }
        arm64 {
            dimension "mode"
            ndk {
                abiFilters "arm64-v8a"
            }
        }
        full {
            dimension "mode"
            ndk {
                abiFilters "arm64-v8a"
            }
        }
    }

    signingConfigs {
        appSign {
            storeFile file('gigginggear.jks')
            storePassword 'gigginggear'
            keyAlias 'gigginggear'
            keyPassword 'gigginggear'
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.appSign
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        debug {
            signingConfig signingConfigs.appSign
            debuggable true
        }

    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.18.1'
        }
    }
    buildFeatures {
        viewBinding true
        prefab true
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    testOptions {
        // RoutingWiresTest loads SignalChainCanvasView's static Color.parseColor
        // constants on the mockable android.jar — return 0 instead of throwing.
        unitTests.returnDefaultValues = true
    }
    namespace 'com.kancrutt.gigginggear'
    ndkVersion '26.1.10909125'
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.22')
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.squareup.okhttp3:okhttp:3.10.0'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.4.1'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.4.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.4.1'
    implementation 'androidx.navigation:navigation-fragment:2.8.7'
    implementation 'androidx.navigation:navigation-ui:2.8.7'
    implementation 'androidx.activity:activity:1.10.0'

    implementation 'com.google.oboe:oboe:1.9.3'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.preference:preference:1.1.1'
    testImplementation 'junit:junit:4.13.2'
    // Real JSON parser for local (JVM) unit tests; the Android stub in
    // android.jar throws "not mocked" otherwise. Test-scope only — never
    // packaged into the APK.
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'

    implementation 'com.google.android.exoplayer:exoplayer-core:2.19.1'
}